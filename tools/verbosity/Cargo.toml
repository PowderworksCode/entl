[package]
name = "verbosity"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Measures relative language verbosity from the Rosetta Code corpus."

# Deliberately outside the Entl workspace. This is a data tool, not part of the
# library: it needs a multi-gigabyte third-party corpus that Entl neither ships
# nor depends on, and its only product is the checked-in table it regenerates.
[workspace]

[[bin]]
name = "verbosity"
path = "src/main.rs"

[dependencies]
entl = { path = "../../crates/entl" }
serde_json = "1"
