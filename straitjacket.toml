[facts]
parser-paths = ["parser-packs"]

[errors]
allowed-in = [
    # Fixture source is input to an analyzer, not code that runs. The discards
    # in it are the thing under test.
    "**/tests/fixtures/**",
    # A corpus tool that reads third-party archives, where a malformed entry is
    # a property of the corpus rather than a failure of the tool.
    "tools/verbosity/**",
]
