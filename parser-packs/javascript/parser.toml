schema = 1
id = "tree-sitter-javascript"
language = "javascript"
version = "0.25.0"
source = "https://github.com/tree-sitter/tree-sitter-javascript"
revision = "44c892e0be055ac465d5eeddae6d3e194424e7de"
license = "MIT"
abi = 15
sha256 = "c46d1e7bccafc40f272bfa292786b2eda7246c3eb5f55e0f95956a1dd56d299b"
comparison-domain = "ecmascript"

[files]
extensions = ["js", "jsx", "mjs", "cjs"]

[tokenization]
ignored-node-kinds = ["comment"]
identifier-node-kinds = [
    "identifier",
    "private_property_identifier",
    "property_identifier",
    "shorthand_property_identifier",
    "shorthand_property_identifier_pattern",
    "statement_identifier",
]
literal-node-kinds = [
    "false",
    "null",
    "number",
    "regex",
    "string",
    "template_string",
    "true",
    "undefined",
]
unit-node-kinds = [
    "arrow_function",
    "class_declaration",
    "function_declaration",
    "function_expression",
    "generator_function_declaration",
    "generator_function",
    "method_definition",
]

[error-handling]
# Any JavaScript callable can throw, so not catching is always available and no
# signature declines it -- the same reading the typescript pack takes, reached
# more directly: TypeScript at least annotates a return type, and JavaScript
# annotates nothing at all.
propagation = "unchecked"
# Empty where the typescript pack names `Promise`, and that is the one real
# difference between the two. TypeScript keeps it for the one thing a signature
# does say; a JavaScript signature says nothing, so there is no return type for
# a name to match and declaring one would describe a capture that cannot occur.
# Under `unchecked` neither spelling changes a verdict.
fallible-types = []
optional-types = []
non-failure-results = []
non-failure-results-forms = []
# Every form named in `discards.scm` names the failure directly, so none is
# ambiguous the way `.unwrap_or_default()` is in Rust.
ambiguous-forms = []

# `[tests]` is deliberately absent, for the reason the typescript pack gives:
# tests are marked by filename convention or by a `describe`/`it` call, not by
# an annotation on the item, so there is nothing for a marker substring to
# match.
