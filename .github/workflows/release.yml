name: release (rust)

# A tag is the whole trigger, so a release is never assembled by hand.
#
# Entl publishes a library and no binaries, so this is the crate half of the
# fleet's Rust release only: no archives, no checksums, no install smoke test.
# If entl ever ships a binary, take the fleet's full workflow rather than
# growing this one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release for
        required: true

permissions:
  contents: read

# Never run two releases at once, and never cancel one in flight: a cancelled
# `cargo publish` can leave a version uploaded that can never be reused.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      # The tag names the version being published, and crates.io can never take
      # that name back, so the two are made to agree before anything is created.
      - name: Check the tag against Cargo.toml
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v${crate}" ]; then
            echo "tag ${TAG} does not match Cargo.toml version ${crate}" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes --latest
          fi

  # Publish to crates.io last: it is the one place a version can never be
  # replaced, so everything checkable is checked first.
  #
  # The logic lives in scripts/publish.sh so the same path can be run by hand,
  # and so this job is a caller rather than a second definition of it.
  crate:
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One place to require a human approval before an irreversible publish:
    # Settings > Environments > crates-io > Required reviewers.
    environment: crates-io
    permissions:
      id-token: write
    env:
      # `secrets` cannot be read from an `if`, so the question of whether one
      # exists is answered here, where it can.
      HAS_STORED_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      # Trusted publishing is the normal path and needs no secret. The stored
      # token exists only to bootstrap: a crate's first version cannot be
      # published this way, because crates.io will not attach a trusted
      # publisher to a crate that does not exist yet. Delete the secret once
      # the trusted publisher is configured and this step takes over again.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        if: env.HAS_STORED_TOKEN == 'false'
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "${HAS_STORED_TOKEN}" = "true" ]; then
            echo "publishing with the stored bootstrap token; delete it once trusted publishing is configured"
          else
            echo "publishing with a short-lived trusted-publishing token"
          fi
          scripts/publish.sh --execute
