[workspace]
resolver = "3"
members = [
    "crates/entl",
    "crates/entl-semantics",
    "crates/entl-tree-sitter",
    "crates/entl-ts-observe",
    "crates/entl-zig-observe",
    "crates/entl-zig-air",
]

exclude = ["crates/entl-rust-mir"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/PowderworksCode/entl"

[workspace.dependencies]
globset = "0.4"
ignore = "0.4"
registry-inventory = { package = "inventory", version = "0.3" }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
sha2 = "0.10"
shell-words = "1.1.1"
tempfile = "3"
thiserror = "2"
toml = "1"
tree-sitter = { version = "0.26", features = ["wasm"] }

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
let_underscore_must_use = "deny"

[profile.release]
lto = "thin"
